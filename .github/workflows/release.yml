# Builds the Windows app (installer + plain .exe) and attaches it to a GitHub Release.
# Start it by pushing a version tag:   git tag v0.1.0 && git push origin v0.1.0
name: Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the web app and the desktop app
        run: npm run desktop:build
      - name: Publish a release (only for tags)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src-tauri/target/release/tham-tu-toan-hoc.exe "Tham-tu-Toan-hoc-${GITHUB_REF_NAME}-portable.exe"
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "Thám tử Toán học Tí hon $GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/nsis/*.exe "Tham-tu-Toan-hoc-${GITHUB_REF_NAME}-portable.exe"
      - name: Keep the files (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/tham-tu-toan-hoc.exe

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>So sánh cân</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .stage { --bg: var(--cmp-bg); }
  .clues { position: absolute; left: 40px; right: 40px; top: 176px; height: 280px; display: flex; justify-content: center; gap: 26px; padding: 18px; }
  .mini { width: 320px; height: 240px; position: relative; background: var(--cmp-bg); border-radius: 24px; }
  .mini .tag { position: absolute; left: 14px; top: 10px; display: flex; align-items: center; gap: 4px; font: 700 16px "Baloo 2"; color: var(--ink-muted); }
  .mini .mbeam { position: absolute; left: 45px; top: 79px; width: 230px; height: 22px; z-index: 2; }
  .mini .mbeam svg { display: block; }
  .mini .mstand { position: absolute; left: 120px; top: 90px; z-index: 1; }
  .mini .mpivot { position: absolute; left: 147px; top: 77px; width: 26px; height: 26px; border-radius: 50%; border: 3.5px solid var(--navy); z-index: 3;
    background: radial-gradient(circle at 35% 32%, #fff6cf 0 18%, #f2b544 50%, #c98a1e 100%); }
  .mini .mpan { position: absolute; top: 88px; width: 110px; height: 108px; z-index: 2; }
  .mini .mpan.L { left: 0; } .mini .mpan.R { left: 210px; }
  .mini .mpan svg { position: absolute; left: 0; }
  .mini .mpan .ch { top: 0; } .mini .mpan .bw { top: 74px; }
  .mini .mpan .gift { position: absolute; left: 20px; top: 10px; }

  .ask { position: absolute; left: 40px; right: 40px; top: 476px; text-align: center; font: 800 30px "Baloo 2"; }
  .choices { position: absolute; left: 40px; right: 40px; top: 530px; display: flex; justify-content: center; gap: 30px; }
  .choice { width: 170px; height: 170px; border-radius: 30px; background: #fff; display: grid; place-items: center; box-shadow: 0 8px 0 rgba(30,42,74,.14); transition: transform .15s; }
  .choice:hover { transform: translateY(-4px); }
  .choice.used { opacity: .3; pointer-events: none; }
  .choice.picked { box-shadow: 0 0 0 6px var(--yellow), 0 8px 0 rgba(30,42,74,.14); }
  .order { position: absolute; left: 40px; right: 40px; top: 530px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .order .choices { position: static; gap: 20px; }
  .order .choice { width: 120px; height: 120px; }
  .slots { display: flex; align-items: center; gap: 10px; }
  .slots .s { width: 116px; height: 104px; border-radius: 22px; border: 4px dashed #8da2c8; display: grid; place-items: center; background: rgba(255,255,255,.6); position: relative; }
  .slots .s small { position: absolute; bottom: -24px; font: 700 15px "Baloo 2"; color: var(--ink-muted); white-space: nowrap; }
  .slots .arr { font: 800 30px "Baloo 2"; color: #8da2c8; }
  .doneWrap { position: absolute; right: 40px; bottom: 40px; }
</style>
</head>
<body>
<div class="stage">
  <div id="top"></div>
  <div class="prompt"><span id="q"></span><button class="replay" id="replay"></button></div>
  <div class="clues card" id="clues"></div>
  <div class="ask" id="ask"></div>
  <div id="answer"></div>
</div>
<script src="shared.js"></script>
<script>
  const T = tier();
  // One gift image, recoloured: same size, so only the scales tell the weight.
  const BOX = { y: { hue: 0, name: "hộp vàng" }, b: { hue: 200, name: "hộp tím" }, g: { hue: 110, name: "hộp xanh lá" }, p: { hue: 300, name: "hộp hồng" } };
  const gift = (k, s) => `<img class="emo gift" src="${E("wrapped_gift")}" width="${s}" height="${s}" style="filter:hue-rotate(${BOX[k].hue}deg)" alt="${BOX[k].name}">`;
  const LEVELS = {
    1: { scales: [["y", "b", "R"], ["b", "g", "R"]], items: ["y", "b", "g"], mode: "heaviest", ans: "g",
         q: "Nhìn hai cái cân. Hộp quà nào nặng nhất?", hint: "Hộp tím nặng hơn hộp vàng. Hộp xanh lá lại nặng hơn hộp tím…" },
    2: { scales: [["y", "b", "R"], ["b", "g", "R"], ["g", "p", "R"]], items: ["g", "y", "p", "b"], mode: "order", ans: ["y", "b", "g", "p"],
         q: "Xếp các hộp quà từ nhẹ nhất đến nặng nhất nhé!", hint: "Tìm hộp nhẹ nhất trước: hộp nào chưa bao giờ nặng hơn hộp khác?" },
    3: { scales: [["g", "b", "L"], ["y", "b", "R"], ["p", "g", "L"]], items: ["b", "p", "y", "g"], mode: "heaviest", ans: "p",
         q: "Các cân bị xếp lộn xộn! Hộp quà nào nặng nhất?", hint: "Cẩn thận: bên nào cân <b>hạ xuống</b> là bên nặng hơn. Đọc từng cân một nhé." },
  };
  const lv = LEVELS[T];
  document.getElementById("top").outerHTML = topbar({ done: 0 });
  document.getElementById("replay").innerHTML = ICON.replay;
  document.getElementById("q").textContent = lv.q;

  // Small copy of the brass scale from game 1 (gradients come from shared.js svgDefs()).
  const mpan = (k, side, dy) => `<div class="mpan ${side}" style="transform:translateY(${dy}px)">
      <svg class="ch" width="110" height="80" viewBox="0 0 110 80"><path d="M55 4 L8 76 M55 4 L102 76" stroke="#8a6526" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 6"/>
        <circle cx="55" cy="5" r="4.5" fill="url(#brass)" stroke="#1e2a4a" stroke-width="2.5"/></svg>
      ${gift(k, 70)}
      <svg class="bw" width="110" height="34" viewBox="0 0 110 34"><path d="M3 7 H107 Q100 31 55 31 Q10 31 3 7 Z" fill="url(#bowlG)" stroke="#1e2a4a" stroke-width="4" stroke-linejoin="round"/>
        <rect x="1" y="3" width="108" height="8" rx="4" fill="#ffd86b" stroke="#1e2a4a" stroke-width="3"/></svg></div>`;
  function mini([a, b, heavy], i) {
    const deg = heavy === "R" ? 9 : -9, dy = 105 * Math.sin(deg * Math.PI / 180);
    return `<div class="mini"><span class="tag">${img("balance_scale", 22)}Cân ${i + 1}</span>
      <svg class="mstand" width="80" height="146" viewBox="0 0 80 146">
        <path d="M34 0 H46 L52 112 H28 Z" fill="url(#brassV)" stroke="#1e2a4a" stroke-width="3" stroke-linejoin="round"/>
        <rect x="30" y="44" width="20" height="7" rx="3.5" fill="url(#brass)" stroke="#1e2a4a" stroke-width="2.5"/>
        <rect x="14" y="108" width="52" height="15" rx="6" fill="url(#wood)" stroke="#1e2a4a" stroke-width="3"/>
        <rect x="3" y="120" width="74" height="20" rx="9" fill="url(#wood)" stroke="#1e2a4a" stroke-width="3"/></svg>
      <div class="mbeam" style="transform:rotate(${deg}deg)"><svg width="230" height="22" viewBox="0 0 230 22">
        <rect x="8" y="4" width="214" height="14" rx="7" fill="url(#brass)" stroke="#1e2a4a" stroke-width="3"/>
        <rect x="16" y="6.5" width="198" height="3" rx="1.5" fill="#fff6cf" opacity=".8"/>
        <circle cx="10" cy="11" r="6.5" fill="url(#brass)" stroke="#1e2a4a" stroke-width="3"/><circle cx="220" cy="11" r="6.5" fill="url(#brass)" stroke="#1e2a4a" stroke-width="3"/></svg></div>
      <div class="mpivot"></div>
      ${mpan(a, "L", -dy)}${mpan(b, "R", dy)}</div>`;
  }
  document.getElementById("clues").innerHTML = lv.scales.map(mini).join("");

  const answer = document.getElementById("answer");
  let check;
  if (lv.mode === "heaviest") {
    document.getElementById("ask").textContent = "Chạm vào hộp nặng nhất:";
    answer.innerHTML = `<div class="choices">${lv.items.map((k) => `<button class="choice" data-k="${k}">${gift(k, 120)}</button>`).join("")}</div>`;
    answer.addEventListener("click", (e) => {
      const c = e.target.closest(".choice"); if (!c) return;
      if (c.dataset.k === lv.ans) feedback(true, `Đúng rồi, ${BOX[lv.ans].name} nặng nhất!`, { next: () => location.reload() });
      else feedback(false, lv.hint);
    });
  } else {
    document.getElementById("ask").textContent = "Chạm lần lượt từng hộp, từ nhẹ đến nặng:";
    const picked = [];
    const paint = () => {
      answer.innerHTML = `<div class="order">
        <div class="slots">${lv.ans.map((_, i) => `<div class="s" data-i="${i}">${picked[i] ? gift(picked[i], 80) : ""}${i === 0 ? "<small>nhẹ nhất</small>" : i === lv.ans.length - 1 ? "<small>nặng nhất</small>" : ""}</div>${i < lv.ans.length - 1 ? `<span class="arr">›</span>` : ""}`).join("")}</div>
        <div class="choices">${lv.items.map((k) => `<button class="choice ${picked.includes(k) ? "used" : ""}" data-k="${k}">${gift(k, 90)}</button>`).join("")}</div></div>
        <div class="doneWrap"><button class="btn btn-primary" id="done">${ICON.check} Xong</button></div>`;
    };
    paint();
    answer.addEventListener("click", (e) => {
      const c = e.target.closest(".choice"), s = e.target.closest(".s"), d = e.target.closest("#done");
      if (c && picked.length < lv.ans.length) { picked.push(c.dataset.k); paint(); }
      else if (s && picked[+s.dataset.i]) { picked.splice(+s.dataset.i, 1); paint(); }
      else if (d) {
        if (picked.join() === lv.ans.join()) feedback(true, "Em xếp đúng thứ tự rồi. Thám tử tài ba!", { next: () => location.reload() });
        else feedback(false, lv.hint);
      }
    });
  }
  document.getElementById("replay").onclick = () => speak(lv.q);
  guide([
    "Mỗi cái cân so sánh <b>hai hộp quà</b>. Các hộp to bằng nhau, nhưng nặng khác nhau.",
    "Bên nào cân <b>hạ xuống</b> là bên <b>nặng hơn</b>.",
    "Đọc từng cân để tìm ra manh mối.",
    lv.mode === "order" ? "Chạm các hộp theo thứ tự từ nhẹ đến nặng, rồi bấm <b>Xong</b>." : "Chạm vào hộp nặng nhất.",
  ]);
  boot(); mockbar({ tiers: true });
  setTimeout(() => speak(lv.q), 600);
</script>
</body>
</html>

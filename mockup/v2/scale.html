<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cái cân</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .stage { --bg: var(--scale-bg); }
  .key { position: absolute; left: 40px; top: 186px; width: 150px; padding: 16px 14px 10px; text-align: center; z-index: 3; }
  .key h3 { font-size: 22px; margin-bottom: 6px; }
  .key .row { display: flex; align-items: center; justify-content: center; gap: 6px; font-family: "Baloo 2"; font-weight: 800; font-size: 32px; margin-bottom: 2px; }
  .key .row .pips { display: flex; gap: 3px; }
  .key .row .pips i { width: 10px; height: 10px; border-radius: 50%; background: var(--navy); display: block; }

  .beam { position: absolute; left: 330px; top: 252px; width: 700px; height: 40px; transition: transform .7s cubic-bezier(.35,1.5,.5,1); z-index: 2; }
  .pivot { position: absolute; left: 655px; top: 247px; width: 50px; height: 50px; border-radius: 50%; border: 5px solid var(--navy); z-index: 3;
    background: radial-gradient(circle at 35% 32%, #fff6cf 0 18%, #f2b544 50%, #c98a1e 100%); }
  .ground { position: absolute; left: 500px; top: 532px; width: 360px; height: 40px; border-radius: 50%; background: radial-gradient(closest-side, rgba(30,42,74,.18), transparent); }
  .sign { position: absolute; left: 646px; top: 172px; width: 68px; height: 68px; border-radius: 50%; background: #fff; border: 5px solid var(--navy);
    display: grid; place-items: center; font: 800 46px/1 "Baloo 2"; padding-top: 6px; z-index: 4; box-shadow: 0 5px 0 rgba(30,42,74,.15); }
  .sign[hidden] { display: none; }
  .sign.eq { background: #d8f5df; border-color: var(--green); color: var(--green); }
  .fx-anim .sign.pop { animation: popIn .4s cubic-bezier(.3,1.6,.5,1); }
  .lock { position: absolute; left: 650px; top: 196px; z-index: 4; transition: opacity .3s, transform .3s; }
  .lock.off { opacity: 0; transform: translateY(-20px) rotate(-20deg); }
  .stand { position: absolute; left: 590px; top: 268px; z-index: 1; }

  .pan { position: absolute; top: 272px; width: 290px; height: 260px; transition: transform .7s cubic-bezier(.35,1.5,.5,1); z-index: 2; }
  .pan.L { left: 215px; } .pan.R { left: 855px; }
  .pan svg.str { position: absolute; inset: 0; }
  .pan .fz {
    position: absolute; left: 24px; right: 24px; bottom: 62px; height: 150px;
    display: flex; flex-wrap: wrap-reverse; justify-content: center; align-content: flex-start; gap: 0 2px;
  }
  .pan .bowl { position: absolute; left: 0; bottom: 0; }
  .pan .count { position: absolute; left: 50%; bottom: 2px; width: 54px; height: 54px; margin-left: -27px; border-radius: 50%; background: #fff; border: 4px solid var(--navy);
    display: grid; place-items: center; font: 800 32px/1 "Baloo 2"; padding-top: 4px; box-shadow: 0 4px 0 rgba(30,42,74,.15); }
  .pan .count:empty { display: none; }
  .pan[data-zone] { border-radius: 30px; }

  .fruit { width: 60px; height: 60px; display: grid; place-items: center; }
  .fruit img { width: 58px; height: 58px; }
  .fruit[data-k="watermelon"] img { width: 66px; height: 66px; }

  .tray { position: absolute; left: 40px; right: 40px; top: 640px; height: 136px; display: flex; align-items: center; padding: 0 22px 0 30px; gap: 20px; }
  .tray .lbl { font-family: "Baloo 2"; font-weight: 800; font-size: 24px; width: 110px; line-height: 1.1; }
  .tray .fz { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; align-content: center; min-height: 100px; border-radius: 22px; background: var(--scale-bg); padding: 6px 12px; }
</style>
</head>
<body>
<div class="stage">
  <div id="top"></div>
  <div class="prompt"><span id="q"></span><button class="replay" id="replay"></button></div>

  <div class="key card" id="key"><h3>Bảng cân</h3></div>

  <div class="ground"></div>
  <svg class="stand" width="180" height="290" viewBox="0 0 180 290">
    <path d="M78 0 H102 L114 236 H66 Z" fill="url(#brassV)" stroke="#1e2a4a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M86 8 L80 228" stroke="#fff6cf" stroke-width="4" stroke-linecap="round" opacity=".7"/>
    <rect x="70" y="72" width="40" height="12" rx="6" fill="url(#brass)" stroke="#1e2a4a" stroke-width="3.5"/>
    <rect x="64" y="160" width="52" height="13" rx="6.5" fill="url(#brass)" stroke="#1e2a4a" stroke-width="3.5"/>
    <rect x="24" y="230" width="132" height="26" rx="10" fill="url(#wood)" stroke="#1e2a4a" stroke-width="4"/>
    <rect x="6" y="252" width="168" height="32" rx="14" fill="url(#wood)" stroke="#1e2a4a" stroke-width="4"/>
    <rect x="34" y="236" width="96" height="5" rx="2.5" fill="#e3b583"/><rect x="20" y="259" width="120" height="5" rx="2.5" fill="#c98a4f"/>
  </svg>
  <div class="beam" id="beam"><svg width="700" height="40" viewBox="0 0 700 40">
    <rect x="22" y="8" width="656" height="24" rx="12" fill="url(#brass)" stroke="#1e2a4a" stroke-width="4"/>
    <rect x="38" y="12" width="624" height="5" rx="2.5" fill="#fff6cf" opacity=".8"/>
    <g fill="#1e2a4a" opacity=".55"><circle cx="110" cy="24" r="3"/><circle cx="190" cy="24" r="3"/><circle cx="270" cy="24" r="3"/><circle cx="430" cy="24" r="3"/><circle cx="510" cy="24" r="3"/><circle cx="590" cy="24" r="3"/></g>
    <circle cx="30" cy="20" r="11" fill="url(#brass)" stroke="#1e2a4a" stroke-width="4"/><circle cx="670" cy="20" r="11" fill="url(#brass)" stroke="#1e2a4a" stroke-width="4"/>
  </svg></div>
  <div class="pivot"></div>
  <div class="sign" id="sign" hidden></div>
  <img class="emo lock off" id="lock" src="assets/emoji/locked_3d.png" width="60" height="60" alt="" title="Cân đang được chốt — bấm Xong để thả cân">

  <div class="pan L" data-zone="L"><svg class="str" viewBox="0 0 290 260"><path d="M145 4 L26 198 M145 4 L264 198" stroke="#8a6526" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 8"/><circle cx="145" cy="6" r="7" fill="url(#brass)" stroke="#1e2a4a" stroke-width="3.5"/></svg>
    <div class="fz"></div>
    <svg class="bowl" width="290" height="72" viewBox="0 0 290 72"><path d="M6 12 H284 Q268 68 145 68 Q22 68 6 12 Z" fill="url(#bowlG)" stroke="#1e2a4a" stroke-width="6" stroke-linejoin="round"/><path d="M44 30 Q145 52 246 30" stroke="#fff6cf" stroke-width="5" fill="none" stroke-linecap="round" opacity=".75"/><rect x="2" y="5" width="286" height="14" rx="7" fill="#ffd86b" stroke="#1e2a4a" stroke-width="5"/></svg>
    <div class="count"></div></div>
  <div class="pan R" data-zone="R"><svg class="str" viewBox="0 0 290 260"><path d="M145 4 L26 198 M145 4 L264 198" stroke="#8a6526" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 8"/><circle cx="145" cy="6" r="7" fill="url(#brass)" stroke="#1e2a4a" stroke-width="3.5"/></svg>
    <div class="fz"></div>
    <svg class="bowl" width="290" height="72" viewBox="0 0 290 72"><path d="M6 12 H284 Q268 68 145 68 Q22 68 6 12 Z" fill="url(#bowlG)" stroke="#1e2a4a" stroke-width="6" stroke-linejoin="round"/><path d="M44 30 Q145 52 246 30" stroke="#fff6cf" stroke-width="5" fill="none" stroke-linecap="round" opacity=".75"/><rect x="2" y="5" width="286" height="14" rx="7" fill="#ffd86b" stroke="#1e2a4a" stroke-width="5"/></svg>
    <div class="count"></div></div>

  <div class="tray card">
    <div class="lbl">Kéo quả vào đĩa:</div>
    <div class="fz" data-zone="tray"></div>
    <button class="btn btn-primary" id="done">Xong</button>
  </div>
</div>
<script src="shared.js"></script>
<script>
  const FRUIT = { grapes: 1, red_apple: 2, watermelon: 3 };
  const T = tier();
  const LEVELS = {
    1: { live: true, key: [], L: [["red_apple", 5]], R: [["red_apple", 2]], tray: [["red_apple", 5]],
         q: "Thêm táo vào đĩa nhẹ hơn để hai đĩa bằng nhau nhé!" },
    2: { live: false, key: ["grapes", "red_apple"], L: [["red_apple", 2]], R: [["red_apple", 1], ["grapes", 1]], tray: [["grapes", 4], ["red_apple", 3]],
         q: "Thêm quả để hai đĩa nặng bằng nhau. Nhớ xem bảng cân nhé!" },
    3: { live: false, key: ["grapes", "red_apple", "watermelon"], L: [["watermelon", 1], ["red_apple", 2]], R: [["watermelon", 2]], tray: [["grapes", 3], ["red_apple", 2], ["watermelon", 2]],
         q: "Hai đĩa chưa bằng nhau. Em thêm quả gì để cân thăng bằng?" },
  };
  const lv = LEVELS[T];

  document.getElementById("top").outerHTML = topbar({ done: 2 });
  document.getElementById("q").textContent = lv.q;
  document.getElementById("replay").innerHTML = ICON.replay;
  document.getElementById("done").innerHTML = ICON.check + " Xong";

  const fruitEl = (k, fixed) => `<div class="fruit" data-item ${fixed ? "data-fixed" : ""} data-k="${k}" data-w="${FRUIT[k]}"><img class="emo" src="${E(k)}" alt=""></div>`;
  const fill = (zoneSel, list, fixed) => {
    const fz = document.querySelector(zoneSel);
    list.forEach(([k, n]) => { fz.insertAdjacentHTML("beforeend", fruitEl(k, fixed).repeat(n)); });
  };
  fill(".pan.L .fz", lv.L, true);
  fill(".pan.R .fz", lv.R, true);
  fill(".tray .fz", lv.tray, false);

  const key = document.getElementById("key");
  if (!lv.key.length) key.style.display = "none";
  lv.key.forEach((k) => key.insertAdjacentHTML("beforeend",
    `<div class="row"><img class="emo" src="${E(k)}" width="46" height="46" alt="">= ${FRUIT[k]}</div>`));

  const weight = (side) => [...document.querySelectorAll(`.pan.${side} [data-item]`)].reduce((s, f) => s + +f.dataset.w, 0);
  const lock = document.getElementById("lock");
  function tilt(show) {
    const L = weight("L"), R = weight("R");
    const deg = show ? Math.max(-12, Math.min(12, (L - R) * -3.5)) : 0;
    const dy = 320 * Math.sin(deg * Math.PI / 180);
    document.getElementById("beam").style.transform = `rotate(${deg}deg)`;
    document.querySelector(".pan.L").style.transform = `translateY(${-dy}px)`;
    document.querySelector(".pan.R").style.transform = `translateY(${dy}px)`;
    lock.classList.toggle("off", show || lv.live);
    if (T === 1) {
      const nL = document.querySelectorAll(".pan.L [data-item]").length, nR = document.querySelectorAll(".pan.R [data-item]").length;
      document.querySelector(".pan.L .count").textContent = nL;
      document.querySelector(".pan.R .count").textContent = nR;
      // Vòng 1: the scale also shows the comparison sign children learn in grade 1
      const sign = document.getElementById("sign"), txt = nL > nR ? ">" : nL < nR ? "<" : "=";
      if (sign.textContent !== txt) { sign.textContent = txt; sign.classList.remove("pop"); void sign.offsetWidth; sign.classList.add("pop"); }
      sign.classList.toggle("eq", txt === "="); sign.hidden = false;
    }
    return { L, R };
  }
  tilt(lv.live);

  dragTap((item, zone) => {
    const fz = zone.matches(".fz") ? zone : zone.querySelector(".fz");
    fz.appendChild(item);
    tilt(lv.live);
  });

  document.getElementById("done").onclick = () => {
    const { L, R } = tilt(true);
    setTimeout(() => {
      if (L === R) feedback(true, "Hai đĩa nặng bằng nhau rồi. Em là thám tử giỏi!", { next: () => location.reload() });
      else feedback(false, `Đĩa bên ${L > R ? "trái" : "phải"} còn nặng hơn. Em thêm hoặc bớt quả ở đĩa bên ${L > R ? "phải" : "trái"} xem nào.`,
        { next: () => tilt(lv.live) });
    }, 800);
  };
  document.getElementById("replay").onclick = () => speak(lv.q);
  guide([
    "Nhìn hai đĩa cân: đĩa nào nặng hơn?",
    T > 1 ? "Xem <b>bảng cân</b>: mỗi loại quả nặng khác nhau." : "Đếm số quả ở mỗi đĩa.",
    "Kéo quả từ khay vào đĩa nhẹ hơn (hoặc chạm quả rồi chạm đĩa).",
    "Bấm <b>Xong</b> để thả cân và xem kết quả.",
  ]);
  boot(); mockbar({ tiers: true });
  setTimeout(() => speak(lv.q), 600);
</script>
</body>
</html>
